# Render Blueprint: the whole hosting config for the site, reviewed like code.
# Spec: https://render.com/docs/blueprint-spec
#
# Keep every setting here. A Blueprint sync overwrites header and route rules
# with the same path and fully replaces buildFilter, so Dashboard edits to them
# are lost or drift from this file. src/test/render.test.js checks this file,
# and scripts/smoke.mjs checks a deploy against it.
services:
  - type: web
    runtime: static
    name: mapthevote-stl
    branch: main
    # Node comes from .node-version (no NODE_VERSION env var), same as CI.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Deploy main only after its GitHub checks (CI) pass.
    autoDeployTrigger: checksPass
    previews:
      generation: automatic
    # Skip builds for changes that never ship. Not **/*.md: Markdown under
    # content/ is built into the learn pages (#21, #23).
    buildFilter:
      ignoredPaths:
        - docs/**
        - README.md
    # Render adds www.mapthevotestl.com and redirects it here.
    domains:
      - mapthevotestl.com
    # Render never rewrites a path where a file exists, so /assets/*, /sw.js,
    # icons and the pre-rendered public pages (#99) are served as files. It
    # serves a directory's index.html only for the path with a trailing slash
    # (/learn/, not /learn: checked on PR #127's preview), so each pre-rendered
    # page but the home page (dist/index.html) has its own rewrite to its file,
    # before the catch-all. One rule per page, not /learn/:topic, so an unknown
    # topic still gets the shell and the app's not-found page; a new topic needs
    # its rule (src/test/render.test.js fails until it has one). Everything
    # else, precinct pages included, gets the client-rendered app shell,
    # shell.html (src/prerender/plugin.js). PR previews keep the service's
    # existing rules, so check a change here on production after it deploys
    # (README, Deploy).
    routes:
      - type: rewrite
        source: /learn
        destination: /learn/index.html
      - type: rewrite
        source: /learn/absentee
        destination: /learn/absentee/index.html
      - type: rewrite
        source: /learn/accessible-voting
        destination: /learn/accessible-voting/index.html
      - type: rewrite
        source: /learn/check-registration
        destination: /learn/check-registration/index.html
      - type: rewrite
        source: /learn/help-voting
        destination: /learn/help-voting/index.html
      - type: rewrite
        source: /learn/mail-in-ballots
        destination: /learn/mail-in-ballots/index.html
      - type: rewrite
        source: /learn/military-overseas
        destination: /learn/military-overseas/index.html
      - type: rewrite
        source: /learn/moved-or-changed-name
        destination: /learn/moved-or-changed-name/index.html
      - type: rewrite
        source: /learn/provisional-ballots
        destination: /learn/provisional-ballots/index.html
      - type: rewrite
        source: /learn/registration-deadlines
        destination: /learn/registration-deadlines/index.html
      - type: rewrite
        source: /learn/voter-id
        destination: /learn/voter-id/index.html
      - type: rewrite
        source: /learn/what-to-expect
        destination: /learn/what-to-expect/index.html
      - type: rewrite
        source: /learn/who-to-contact
        destination: /learn/who-to-contact/index.html
      - type: rewrite
        source: /learn/your-rights
        destination: /learn/your-rights/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /*
        destination: /shell.html
    headers:
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # connect-src: the county ArcGIS services (src/config/election.js
      # serviceRoot, and the County and City early voting wait time layers in
      # waitTimes, #103, on the same host), the county address points for address search (#49,
      # src/data/countyAddress.js: the live county server and its hosted
      # copy), the City of St. Louis's geocoder for the City check (#58,
      # src/data/cityAddress.js), the Photon geocoder (#7) and the OpenFreeMap basemap
      # (#13, src/features/lookup/basemap.js), whose style, tiles, sprites and
      # glyphs share one origin. MapLibre fetches all of those, images too
      # (decoded with createImageBitmap, which img-src does not govern), so
      # img-src stays 'self'. Its worker is a same-origin file under /assets/
      # (script-src 'self'), so no blob: source is needed, and the app ships
      # its own map CSS instead of maplibre-gl.css, so no data: icons either.
      # Links to other official sites are navigation, which connect-src does
      # not govern.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self';
          img-src 'self';
          font-src 'self';
          connect-src 'self' https://services6.arcgis.com https://maps.stlouisco.com https://services2.arcgis.com https://maps6.stlouis-mo.gov https://photon.komoot.io https://tiles.openfreemap.org;
          manifest-src 'self';
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none';
          upgrade-insecure-requests
      # Cache-Control: no two rules may match the same path. Render does not
      # document how same-name rules combine, and a joined or wrong value could
      # keep voters on an old build. The shell and the pre-rendered pages
      # (under /, /learn and /privacy) always revalidate; hashed assets never
      # change.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /shell.html
        name: Cache-Control
        value: no-cache
      - path: /p/*
        name: Cache-Control
        value: no-cache
      - path: /learn
        name: Cache-Control
        value: no-cache
      - path: /learn/*
        name: Cache-Control
        value: no-cache
      - path: /privacy
        name: Cache-Control
        value: no-cache
      - path: /privacy/*
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      # Built by src/features/learn/content/searchEngines.js (#97). An hour, so a fix reaches
      # crawlers soon without every request going to the origin.
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
