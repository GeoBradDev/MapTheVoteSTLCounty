name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new PR run cancels the older one for that PR. Pushes get a group per run,
  # because a shared group would cancel a pending run on main even without
  # cancel-in-progress, leaving that commit with no finished CI run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # The header and cache rules in render.yaml match these paths.
      # When the PWA (#25) lands, also check dist/sw.js and dist/manifest.webmanifest.
      - name: Check build output
        run: |
          test -f dist/index.html
          ls dist/assets/index-*.js dist/assets/index-*.css
          grep -q 'src="/assets/index-' dist/index.html
          grep -q 'href="/assets/index-' dist/index.html

      # Accessibility in a real browser (#26): axe, reflow, skip link and focus
      # on the key routes at 360 and 1280 px, against the build above. The
      # county's layers come from recorded fixtures; no live service is called.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
