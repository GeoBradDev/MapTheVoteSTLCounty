name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new PR run cancels the older one for that PR. Pushes get a group per run,
  # because a shared group would cancel a pending run on main even without
  # cancel-in-progress, leaving that commit with no finished CI run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # The header and cache rules in render.yaml match these paths. The web
      # app manifest and its icons (#25); no service worker until #183, which
      # adds dist/sw.js here.
      - name: Check build output
        run: |
          test -f dist/index.html
          ls dist/assets/index-*.js dist/assets/index-*.css
          grep -q 'src="/assets/index-' dist/index.html
          grep -q 'href="/assets/index-' dist/index.html
          test -f dist/manifest.webmanifest
          ls dist/icons/icon-192.png dist/icons/icon-512.png dist/icons/maskable-192.png dist/icons/maskable-512.png
          grep -q 'rel="apple-touch-icon" href="/apple-touch-icon.png"' dist/index.html
          test ! -e dist/sw.js

      # Accessibility in a real browser (#26): axe, reflow, skip link and focus
      # on the key routes at 360 and 1280 px, against the build above. The
      # county's layers come from recorded fixtures; no live service is called.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Performance (#27): Lighthouse mobile emulation at 360 px on simulated
      # slow 4G, on /, a results page and /learn, against the build above.
      # Fails below a score of 90 or with LCP at 2.5 s or more. The county's
      # layers come from the recorded fixtures through a local server; no live
      # service is called. The median run's reports are kept as an artifact.
      - run: npm run test:perf

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore
