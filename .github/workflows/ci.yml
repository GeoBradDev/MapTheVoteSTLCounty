name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new PR run cancels the older one for that PR. Pushes get a group per run,
  # because a shared group would cancel a pending run on main even without
  # cancel-in-progress, leaving that commit with no finished CI run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html
          ls dist/assets/index-*.js dist/assets/index-*.css
