# Checks the live election layers, the geocoder, the learn topics' source
# links and the pages the election config links every day through Election
# Day, and opens an issue (or comments on the open one) when a check fails.
# It has no pull_request or push trigger, so a live outage can never block a
# merge: the CI workflow (ci.yml) never calls a live service.

name: Data health

on:
  schedule:
    # 12:00 UTC: 7 a.m. in Chicago while daylight time lasts, 6 a.m. after.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: data-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Worst case with every request slow: about 22 minutes for the config check
    # (26 requests, 3 tries of 15 s each) and 16 for the geocoder check. A job
    # that hits its limit is cancelled and reports nothing, so each live check
    # has its own step limit, which fails that step and still opens the issue.
    # The job limit is the step limits plus setup.
    timeout-minutes: 70
    steps:
      # The token may write issues: do not leave it in .git/config, where
      # dependency install scripts could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Scheduled runs stop once Election Day is over in the config's time zone.
      # A manual run always checks. This runs first, on the runner's own Node,
      # so a failing install after the election cannot open an issue; the
      # script and the config import nothing from node_modules.
      - name: Election window
        id: window
        run: |
          past=$(node --input-type=module -e "
            import election from './src/config/election.js';
            import { isPastElection } from './scripts/check-config.mjs';
            console.log(isPastElection(election));
          ")
          if [ "$past" = true ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "Election Day is over: skipping the scheduled checks."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.window.outputs.active == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
        if: steps.window.outputs.active == 'true'

      - name: Election config check
        id: config
        if: steps.window.outputs.active == 'true'
        timeout-minutes: 25
        run: node scripts/check-config.mjs

      # These run even when an earlier check failed, so one issue reports all.
      - name: Geocoder check
        id: geocoder
        if: ${{ !cancelled() && steps.window.outputs.active == 'true' }}
        timeout-minutes: 20
        run: node scripts/check-geocoder.mjs

      # Every source and link in content/<locale>/learn/ (#21) and every page
      # the election config links (#74). Each dead URL can take about 51 s
      # (3 tries of 15 s plus waits). A page behind a bot challenge is skipped,
      # not failed, and listed for a person to open in a browser.
      - name: Content link check
        id: links
        if: ${{ !cancelled() && steps.window.outputs.active == 'true' }}
        timeout-minutes: 12
        run: node scripts/check-content-links.mjs --skipped "$RUNNER_TEMP/skipped-links.txt"

      # A skip never fails the run, so list it on the run's summary every day.
      - name: List skipped links
        if: ${{ !cancelled() && steps.window.outputs.active == 'true' }}
        run: |
          file="$RUNNER_TEMP/skipped-links.txt"
          if [ -s "$file" ]; then
            {
              echo "### Links to check by hand"
              echo
              echo "These answered with a bot challenge. Open each in a browser before Election Day."
              echo
              sed 's/^/- /' "$file"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report the failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          GEOCODER_OUTCOME: ${{ steps.geocoder.outcome }}
          LINKS_OUTCOME: ${{ steps.links.outcome }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="The data health check failed on $(date -u +%Y-%m-%d).

          - Election config check (scripts/check-config.mjs): $CONFIG_OUTCOME
          - Geocoder check (scripts/check-geocoder.mjs): $GEOCODER_OUTCOME
          - Content link check (scripts/check-content-links.mjs): $LINKS_OUTCOME

          Log: $run_url"
          skipped_file="$RUNNER_TEMP/skipped-links.txt"
          if [ -s "$skipped_file" ]; then
            body="$body

          Skipped behind a bot challenge, so check each by hand in a browser before Election Day:
          $(sed 's/^/- /' "$skipped_file")"
          fi
          gh label create "data health" --repo "$GITHUB_REPOSITORY" --color fbca04 \
            --description "Failures from the scheduled data health check" 2>/dev/null || true
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "data health" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Data health check failed" \
              --label "data health" --body "$body"
          fi
