# Checks the live election layers, the geocoder, the learn topics' source
# links and the pages the election config links every day through Election
# Day, and opens an issue (or comments on the open one) when a check fails.
# During early voting it also checks the election layers, wait time layers
# included, every 2 hours of the voting day, so a board that starts or stops
# reporting line counts is noticed the same day (#106).
# It has no pull_request or push trigger, so a live outage can never block a
# merge: the CI workflow (ci.yml) never calls a live service.

name: Data health

on:
  schedule:
    # 12:00 UTC: 7 a.m. in Chicago while daylight time lasts, 6 a.m. after.
    - cron: '0 12 * * *'
    # Every 2 hours from 14:00 to 22:00 UTC: 9 a.m. to 5 p.m. in Chicago in
    # daylight time, 8 a.m. to 4 p.m. after. Only on days inside the config's
    # early voting dates (scripts/electionWindow.mjs), so these stop after the
    # last early voting day with no edit. Keep it equal to WAITS_CRON there.
    - cron: '0 14-22/2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: data-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Worst case with every request slow: about 26 minutes for the config check
    # (30 requests with the wait time layers, 3 tries of 15 s each, about 51 s
    # each with the waits) and 16 for the geocoder check. A job
    # that hits its limit is cancelled and reports nothing, so each live check
    # has its own step limit, which fails that step and still opens the issue.
    # The job limit is the step limits plus setup.
    timeout-minutes: 78
    steps:
      # The token may write issues: do not leave it in .git/config, where
      # dependency install scripts could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # What this run checks: everything (`full`), the election config check
      # only (`waits`, the open-hours runs during early voting) or nothing
      # (`off`). The daily run stops once Election Day is over in the config's
      # time zone; a manual run always checks everything. This runs first, on
      # the runner's own Node, so a failing install after the election cannot
      # open an issue: electionWindow.mjs and the config import nothing (not
      # check-config.mjs, which imports the app and its packages).
      - name: Election window
        id: window
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          mode=$(node --input-type=module -e "
            import election from './src/config/election.js';
            import { windowFor } from './scripts/electionWindow.mjs';
            console.log(windowFor(election, {
              event: process.env.GITHUB_EVENT_NAME,
              schedule: process.env.EVENT_SCHEDULE,
            }));
          ")
          echo "Run mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = off ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.window.outputs.active == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
        if: steps.window.outputs.active == 'true'

      - name: Election config check
        id: config
        if: steps.window.outputs.active == 'true'
        timeout-minutes: 30
        run: node scripts/check-config.mjs --warnings "$RUNNER_TEMP/wait-warnings.txt"

      # A warning (a wait time source that looks quiet or broken, such as
      # early voting sites open with no fresh line count) never fails the run,
      # so list it on the run's summary.
      - name: List warnings
        if: ${{ !cancelled() && steps.window.outputs.active == 'true' }}
        run: |
          file="$RUNNER_TEMP/wait-warnings.txt"
          if [ -s "$file" ]; then
            {
              echo "### Warnings from the election config check"
              echo
              sed 's/^/- /' "$file"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # These run even when an earlier check failed, so one issue reports all.
      # The open-hours runs (mode `waits`) skip them: once a day is enough.
      - name: Geocoder check
        id: geocoder
        if: ${{ !cancelled() && steps.window.outputs.active == 'true' && steps.window.outputs.mode == 'full' }}
        timeout-minutes: 20
        run: node scripts/check-geocoder.mjs

      # Every source and link in content/<locale>/learn/ (#21) and every page
      # the election config links (#74). A dead URL takes about 51 s (3 tries
      # of 15 s plus waits). www.sos.mo.gov sometimes stalls about 60 s on a
      # healthy page (#116), so up to 3 URLs a run whose second try timed out
      # get 75 s on their last try: about 111 s each, 3 minutes more in all. A page
      # behind a bot challenge is skipped, not failed, and listed for a person
      # to open in a browser.
      - name: Content link check
        id: links
        if: ${{ !cancelled() && steps.window.outputs.active == 'true' && steps.window.outputs.mode == 'full' }}
        timeout-minutes: 15
        run: node scripts/check-content-links.mjs --skipped "$RUNNER_TEMP/skipped-links.txt"

      # A skip never fails the run, so list it on the run's summary every day.
      - name: List skipped links
        if: ${{ !cancelled() && steps.window.outputs.active == 'true' && steps.window.outputs.mode == 'full' }}
        run: |
          file="$RUNNER_TEMP/skipped-links.txt"
          if [ -s "$file" ]; then
            {
              echo "### Links to check by hand"
              echo
              echo "These answered with a bot challenge. Open each in a browser before Election Day."
              echo
              sed 's/^/- /' "$file"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report the failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          GEOCODER_OUTCOME: ${{ steps.geocoder.outcome }}
          LINKS_OUTCOME: ${{ steps.links.outcome }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="The data health check failed on $(date -u +%Y-%m-%d).

          - Election config check (scripts/check-config.mjs): $CONFIG_OUTCOME
          - Geocoder check (scripts/check-geocoder.mjs): $GEOCODER_OUTCOME
          - Content link check (scripts/check-content-links.mjs): $LINKS_OUTCOME

          Log: $run_url"
          warnings_file="$RUNNER_TEMP/wait-warnings.txt"
          if [ -s "$warnings_file" ]; then
            body="$body

          Warnings from the election config check:
          $(sed 's/^/- /' "$warnings_file")"
          fi
          skipped_file="$RUNNER_TEMP/skipped-links.txt"
          if [ -s "$skipped_file" ]; then
            body="$body

          Skipped behind a bot challenge, so check each by hand in a browser before Election Day:
          $(sed 's/^/- /' "$skipped_file")"
          fi
          gh label create "data health" --repo "$GITHUB_REPOSITORY" --color fbca04 \
            --description "Failures from the scheduled data health check" 2>/dev/null || true
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "data health" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Data health check failed" \
              --label "data health" --body "$body"
          fi
